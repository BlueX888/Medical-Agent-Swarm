services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      # A Docker-managed volume is required on Windows/WSL2. Host bind mounts
      # are not fully POSIX-compatible and can corrupt Qdrant mmap payload data.
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
